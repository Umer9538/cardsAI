# Carbsai backend, on Cloudflare Workers.
#
# This replaces the Firebase Cloud Functions in `functions/` so the project can
# stay on the Spark plan: Spark blocks outbound calls to any non-Google host,
# which is what made `analyzeMeal` undeployable there. A Worker has no such
# restriction, so OpenAI, the email provider and R2 are all reachable.
#
# Firebase is still the system of record — Auth issues the tokens this Worker
# verifies, and Firestore holds every document. The Worker reaches both over
# their REST APIs with a service-account token, which is exactly what the Admin
# SDK did, minus the SDK.
#
#   npx wrangler deploy
#   npx wrangler secret put OPENAI_API_KEY
#   ...see workers/README.md for the full list

name = "carbsai-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
FIREBASE_PROJECT_ID = "carbsai-8cca8"
# Public base URL for meal photos. Set to the R2 bucket's custom domain once it
# has one; until then uploads still work and reads fall back to the local file.
PHOTO_PUBLIC_BASE = ""

# Meal photos. Replaces Cloud Storage — R2 has zero egress fees, which is the
# whole reason it is here rather than in Firebase.
#
# COMMENTED OUT until R2 is enabled on the account. Enabling it is a one-off in
# the Cloudflare dashboard (R2 → Overview) and asks for a payment method, even
# though the free tier — 10 GB stored, zero egress — covers this app. Workers
# themselves need no card, which is why everything else deploys without this.
#
# Without the binding the Worker deploys and runs normally; only `/photos`
# returns "photo storage is not configured". The app already treats a failed
# upload as non-fatal — the meal is logged and the diary keeps showing the
# local file — so this degrades exactly the way a Storage outage would.
#
# To turn photos on: enable R2, `npm run r2:create`, uncomment the three lines
# below, then `npm run deploy`.
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "carbsai-photos"

# Weekly food-catalogue refresh, Sunday.
#
# Weekly rather than daily because of Firestore's free-tier write quota, not
# because of FDC. A full walk is ~13,300 document writes and the free plan
# allows 20,000 a day — a daily sync would spend two thirds of that budget every
# day, competing with the writes real users make. FDC publishes these datasets a
# few times a year, so weekly is already far more often than the data changes.
[triggers]
crons = ["17 4 * * SUN"]

[observability]
enabled = true
